settings:
  application:
    # dev开发环境 test测试环境 prod线上环境
    mode: ${MODE}
    # 服务器ip，默认使用 0.0.0.0
    host: 0.0.0.0
    # 服务名称
    name: futren
    # 端口号
    port: ${PORT} # 服务端口号
    readtimeout: ${READ_TIMEOUT}
    writertimeout: ${WRITE_TIMEOUT}
    # 数据权限功能开关
    enabledp: false
  logger:
    # 日志存放路径
    path: temp/logs
    # 日志输出，file：文件，default：命令行，其他：命令行
    stdout: 'default' #控制台日志，启用后，不输出到文件
    # 日志等级, trace, debug, info, warn, error, fatal
    level: trace
    # 数据库日志开关
    enableddb: true
  jwt:
    # token 密钥，生产环境时及的修改
    secret: ${ADMIN_JWT_SECRET}
    # token 过期时间 单位：秒
    timeout: ${ADMIN_JWT_TIMEOUT}
  database:
    # 数据库类型 mysql, tidb, sqlite3, postgres, sqlserver
    # sqlserver: sqlserver://用户名:密码@地址?database=数据库名
    driver: tidb
    # 数据库连接字符串 mysql 缺省信息 charset=utf8&parseTime=True&loc=Local&timeout=1000ms
    source: ${DB_SOURCE}
#  databases:
#    'locaohost:8000':
#      driver: mysql
#        # 数据库连接字符串 mysql 缺省信息 charset=utf8&parseTime=True&loc=Local&timeout=1000ms
#        source: user:password@tcp(127.0.0.1:3306)/dbname?charset=utf8&parseTime=True&loc=Local&timeout=1000ms
#      registers:
#        - sources:
#            - user:password@tcp(127.0.0.1:3306)/dbname?charset=utf8&parseTime=True&loc=Local&timeout=1000ms
  gen:
    # 代码生成读取的数据库名称
    dbname: dbname
    # 代码生成是使用前端代码存放位置，需要指定到src文件夹，相对路径
    frontpath: ../go-admin-ui/src
  extend: # 扩展配置
    amap:
      key: de7a062c984bf828d5d1b3a631a517e4
    violet:
      targetURL: ${VIOLET_TARGET_URL}  # Violet 服务地址
      domainID: ${DOMAIN_ID}          # 域ID（与 LinkForty 代理共用）
    linkforty:
      targetURL: ${LINKFORTY_TARGET_URL}  # LinkForty 服务地址
    telemarketing:
      targetURL: ${TELEMARKETING_TARGET_URL}  # Telemarketing 服务地址（默认端口 9999）
    sms:
      targetURL: ${SMS_TARGET_URL}  # SMS 服务地址（/poplar/sms/v1 转发目标）
    chatAdminAPI:
      targetURL: ${CHAT_ADMIN_API_TARGET_URL}  # nwachat_im_admin_go，如 http://chat-admin-api:9999
    upload:
      appKey: ${UPLOAD_APP_KEY}                    # 应用标识
      secret: ${UPLOAD_APP_SECRET}     # 与上传服务约定的密钥
    frontend:
      baseSiteURL: ${BASE_SITE_URL}      # 基础站点URL
      baseUploadURL: ${BASE_UPLOAD_URL}  # 上传基础URL
  cache:
#    redis:
#      addr: 127.0.0.1:6379
#      password: xxxxxx
#      db: 2
    # key存在即可
    memory: '' 
  queue:
    memory:
      poolSize: 100
